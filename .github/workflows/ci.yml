name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type-check, unit tests, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # npm 10.9 has a dependency-resolution bug with this tree; pin npm 11.
      - name: Install dependencies
        run: npx -y npm@11.6.2 ci --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build
        env:
          TURSO_DATABASE_URL: file:/tmp/ci-build.db
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end owner checklist
        run: npm run test:e2e

      - name: Validate n8n workflow JSON
        run: |
          node -e "
          for (const f of ['n8n/workflows/support-dual-llm.json', 'n8n/workflows/error-handler.json']) {
            const w = JSON.parse(require('fs').readFileSync(f, 'utf8'));
            const names = new Set(w.nodes.map((n) => n.name));
            if (names.size !== w.nodes.length) throw new Error(f + ': duplicate node names');
            for (const [from, c] of Object.entries(w.connections)) {
              if (!names.has(from)) throw new Error(f + ': unknown source ' + from);
              for (const outs of c.main) for (const l of outs) if (!names.has(l.node)) throw new Error(f + ': unknown target ' + l.node);
            }
            console.log(f, w.nodes.length, 'nodes OK');
          }"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
