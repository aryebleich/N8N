name: Deploy n8n workflows

# Pushes n8n/workflows/*.json into your n8n instance through its public API
# (scripts/deploy-n8n.mjs). Credentials you selected in n8n and the values of
# the ⚙️ CONFIG nodes are kept on every deploy.
#
# Repository secrets:
#   N8N_API_URL       e.g. https://n8n.example.com   (required)
#   N8N_API_KEY       n8n → Settings → n8n API → Create an API key (required)
#   N8N_CONFIG_JSON   optional JSON object of CONFIG values to set, e.g.
#                     {"ADMIN_SITE_URL":"https://support-admin.example.com",
#                      "TURSO_DATABASE_URL":"https://db-org.turso.io",
#                      "ORACLE_ORDS_BASE_URL":"https://.../ords/support_ro",
#                      "SLACK_CHANNEL_ID":"C0123456789"}

on:
  push:
    branches: [main]
    paths:
      - 'n8n/workflows/**'
      - 'scripts/deploy-n8n.mjs'
      - '.github/workflows/deploy-n8n.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-n8n
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Deploy workflows
        env:
          N8N_API_URL: ${{ secrets.N8N_API_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          N8N_CONFIG_JSON: ${{ secrets.N8N_CONFIG_JSON }}
        run: node scripts/deploy-n8n.mjs
