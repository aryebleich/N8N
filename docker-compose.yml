# Support assistant admin panel.
#   cp .env.example .env      # add your keys (optional at first)
#   docker compose up -d --build
#   open http://localhost:3000
#
# There is NO login. The port is published on 127.0.0.1 only, so the panel opens on this
# computer and nowhere else. Read "Security" in README.md before changing that.
# Tables and sample data are created automatically on first start (no migrate step).

services:
  app:
    build: { context: ., target: runner }
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - panel-data:/app/data    # the local database file (unused if TURSO_DATABASE_URL points to Turso)
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  panel-data:
